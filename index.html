<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#3b1f3d" />
<title>Aslı'nın Playlist Falı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-950:#241220; --plum-800:#3b1f3d; --plum-700:#54295a;
    --blush:#fbeee6; --paper:#f6e4d8; --ink:#221019; --muted:#7a6270;
    --gold:#d9a441; --rule:rgba(34,16,25,.13);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    min-height:100dvh; font-family:'Work Sans',system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--plum-700) 0%, var(--plum-800) 45%, var(--plum-950) 100%);
    display:flex; align-items:center; justify-content:center; padding:24px;
    overflow-x:hidden;
  }
  .serif{ font-family:'Fraunces',serif }

  .card{
    width:100%; max-width:420px; background:var(--blush); border-radius:28px;
    padding:38px 30px; text-align:center; box-shadow:0 40px 90px rgba(0,0,0,.4);
    position:relative;
  }
  .badge{
    width:64px; height:64px; border-radius:50%; margin:0 auto 18px; background:var(--plum-800);
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--plum-800); line-height:1.25 }
  .sub{ margin-top:10px; font-size:14px; color:var(--muted); line-height:1.6 }

  .btn{
    margin-top:28px; width:100%; padding:16px; border-radius:14px; border:none;
    background:var(--plum-800); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s ease;
  }
  .btn:active{ transform:scale(.97) }
  .btn:disabled{ opacity:.6 }

  .result{ margin-top:26px; display:none; text-align:left }
  .result.show{ display:block; animation:fadeUp .5s ease }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }

  .track-row{ display:flex; gap:14px; align-items:center; margin-bottom:16px }
  .art{ width:64px; height:64px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--paper); box-shadow:0 8px 20px rgba(34,16,25,.18) }
  .track-name{ font-family:'Fraunces',serif; font-weight:700; font-size:16.5px; color:var(--plum-800); line-height:1.3 }
  .track-artist{ font-size:12.5px; color:var(--muted); margin-top:3px }

  .embed-wrap{ border-radius:14px; overflow:hidden; box-shadow:0 8px 20px rgba(34,16,25,.12) }
  .embed-wrap iframe{ display:block; border:0; width:100%; height:152px }

  .spotify-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-size:12.5px;
    color:var(--plum-700); text-decoration:underline; font-weight:600;
  }

  .error{ margin-top:20px; font-size:13px; color:#a5372c; display:none }
  .error.show{ display:block }

  .spin{ display:inline-block; width:14px;height:14px;border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite }
  @keyframes sp{ to{ transform:rotate(360deg) } }

  .footnote{ margin-top:24px; font-size:11px; color:var(--muted); opacity:.7 }
</style>
</head>
<body>

  <div class="card">
    <div class="badge">🎧</div>
    <h1>Merhaba Aslı Hanım,<br>bugün hangi şarkı sizi bulacak?</h1>
    <p class="sub">Butona basın, playlistinizden size özel bir şarkı çıksın.</p>

    <button class="btn" id="pickBtn">🎵 Bana Bir Şarkı Öner</button>

    <div class="result" id="result">
      <div class="track-row">
        <img class="art" id="art" src="" alt="">
        <div>
          <div class="track-name" id="trackName"></div>
          <div class="track-artist" id="trackArtist"></div>
        </div>
      </div>
      <div class="embed-wrap">
        <iframe id="embedFrame" src="" allow="encrypted-media" loading="lazy"></iframe>
      </div>
      <a class="spotify-link" id="spotifyLink" href="#" target="_blank" rel="noopener">Spotify'da Aç ↗</a>
    </div>

    <div class="error" id="errorBox">Bir şeyler ters gitti, tekrar dener misiniz?</div>

    <div class="footnote">Made by Veysi Varlı</div>
  </div>

<script>
  const btn = document.getElementById('pickBtn');
  const result = document.getElementById('result');
  const errorBox = document.getElementById('errorBox');
  const art = document.getElementById('art');
  const trackName = document.getElementById('trackName');
  const trackArtist = document.getElementById('trackArtist');
  const embedFrame = document.getElementById('embedFrame');
  const spotifyLink = document.getElementById('spotifyLink');

  async function pickSong(){
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Aranıyor…';
    errorBox.classList.remove('show');
    result.classList.remove('show');

    try{
      const res = await fetch('/.netlify/functions/playlist-song', { cache: 'no-store' });
      const data = await res.json();

      if (!data.configured){
        errorBox.textContent = data.needs_auth
          ? 'Henüz yetkilendirme yapılmadı — kurulum tamamlanmayı bekliyor.'
          : 'Site henüz kurulum aşamasında — Client ID/Secret eklenmemiş.';
        errorBox.classList.add('show');
        return;
      }
      if (data.error || !data.name){
        errorBox.textContent = 'Hata: ' + (data.error || 'bilinmeyen') + (data.detail ? ' — ' + JSON.stringify(data.detail).slice(0,200) : '');
        errorBox.classList.add('show');
        return;
      }

      trackName.textContent = data.name;
      trackArtist.textContent = data.artist || '';
      art.src = data.album_art || '';
      embedFrame.src = `https://open.spotify.com/embed/track/${data.id}?utm_source=generator&theme=0`;
      spotifyLink.href = data.spotify_url || '#';
      result.classList.add('show');
    }catch(e){
      errorBox.textContent = 'Bağlantı kurulamadı, tekrar dener misiniz?';
      errorBox.classList.add('show');
    }finally{
      btn.disabled = false;
      btn.innerHTML = '🎲 Başka Bir Şarkı';
    }
  }

  btn.addEventListener('click', pickSong);
</script>
</body>
</html>
